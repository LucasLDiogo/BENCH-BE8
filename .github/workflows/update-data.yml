name: Atualizar Market Intelligence Be8

# Roda às 10:00 UTC (07:00 BRT) e 16:00 UTC (13:00 BRT)
# Brasil é UTC-3 sem horário de verão
on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 BRT
    - cron: '0 16 * * *'   # 13:00 BRT
  workflow_dispatch:       # botão manual

permissions:
  contents: write          # necessário para commit/push

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar agente de atualização
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY:  ${{ secrets.EIA_API_KEY }}
        run: |
          python scripts/agente_atualizacao.py || true
          # `|| true` para não quebrar Actions em caso de falha parcial
          # O próprio agente decide exit code 0/1 conforme corretude

      - name: Atualizar build stamp
        run: python scripts/atualizar_html.py

      - name: Verificar mudanças
        id: check
        run: |
          if [ -n "$(git status --porcelain data/ logs/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit + Push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "Be8 Market Intel Bot"
          git config user.email "bot@be8-market-intel.local"
          git add data/ logs/
          TS=$(date -u +'%Y-%m-%d %H:%M UTC')
          git commit -m "Atualização automática Market Intelligence Be8 · $TS"
          git push

      - name: Upload logs (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
