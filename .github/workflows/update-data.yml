name: Update Market Intelligence Data

on:
  schedule:
    # 10:00 UTC = 07:00 BRT
    # 16:00 UTC = 13:00 BRT
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:    # também roda manualmente em Actions → Run workflow

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # precisa para commitar JSONs atualizados de volta

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market intelligence agent
        run: python scripts/agente_atualizacao.py
        continue-on-error: true   # nunca derruba o workflow: o painel
                                  # mostra status próprio das fontes
      - name: Commit data updates
        run: |
          git config user.name  "be8-bot"
          git config user.email "be8-bot@users.noreply.github.com"
          git add data/ logs/ || true
          if git diff --cached --quiet; then
            echo "Sem mudanças para commitar"
          else
            git commit -m "data: atualização automática $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
